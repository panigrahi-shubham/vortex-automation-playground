<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Orvilo design screen: original work, released under CC0 1.0. See LICENSE.txt. -->
<meta charset="utf-8">
<title>Orvilo — Shop on a phone</title>
<style>
body{margin:0;background:#F4F5F7}
a{color:#2747F5}a:hover{color:#1B33B8}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<link rel="stylesheet" href="assets/fonts.css">
</head>
<body>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #F4F5F7; color: #111318; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="background: #111318; color: #FFFFFF; font-size: 11px; text-align: center; padding: 6px 12px">Demo store · no real orders or payments</div>
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB; padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Open menu" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: none; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22"><path d="M3 6h16M3 11h16M3 16h16" stroke="#111318" stroke-width="2" stroke-linecap="round"></path></svg></button>
      <a href="index.html" style="flex: 1; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #111318; font-weight: 800; font-size: 20px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" fill="none" stroke="#2747F5" stroke-width="3"></circle><circle cx="14" cy="14" r="4.5" fill="#2747F5"></circle></svg>Orvilo</a>
      <a href="cart.html" aria-label="Cart, 3 items" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22"><path d="M3 4h2l2 11h10l2-8H6.5" fill="none" stroke="#111318" stroke-width="2" stroke-linejoin="round"></path><circle cx="9" cy="18.5" r="1.4" fill="#111318"></circle><circle cx="16" cy="18.5" r="1.4" fill="#111318"></circle></svg><span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: #2747F5; color: #FFFFFF; font-size: 11px; font-weight: 800; display: grid; place-items: center">3</span></a>
    </div>
    <label class="sr-only" for="m-search">Search products</label>
    <input id="m-search" type="search" placeholder="Search products" style="min-height: 44px; border: 1px solid #D3D7DE; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px; background: #F7F8FA">
  </header>

  <main style="flex: 1; overflow: hidden; padding: 14px 16px 0">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">All products</h1>
      <span style="font-size: 13px; color: #5A6170">44 results</span>
    </div>
    <div style="display: flex; gap: 8px; margin-bottom: 12px">
      <button type="button" style="flex: 1; min-height: 44px; border: 1px solid #D3D7DE; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Filters · 2</button>
      <button type="button" style="flex: 1; min-height: 44px; border: 1px solid #D3D7DE; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Sort: Featured</button>
    </div>
    <div style="display: flex; gap: 6px; margin-bottom: 14px; overflow: hidden">
      <span style="flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; background: #EEF1FE; color: #2747F5; font-size: 13px; font-weight: 700">$20 – $150 ✕</span>
      <span style="flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; background: #EEF1FE; color: #2747F5; font-size: 13px; font-weight: 700">4 stars and up ✕</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      
        <article style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; overflow: hidden">
          <a href="product.html" aria-label="Mechanical Keyboard" style="display: block; position: relative; height: 128px; background: #E9EEF6">
            <span style="position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 6px; background: #B42318; color: #FFFFFF; font-size: 11px; font-weight: 800">Sale</span>
          </a>
          <div style="padding: 10px 10px 12px">
            <h2 style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.3">Mechanical Keyboard</h2>
            <p style="margin: 4px 0 0; font-size: 12px; color: #5A6170">★ 4.7</p>
            <p style="margin: 6px 0 0; font-size: 15px; font-weight: 800">$89.00</p>
          </div>
        </article>
      
        <article style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; overflow: hidden">
          <a href="product.html" aria-label="Classic Hoodie" style="display: block; position: relative; height: 128px; background: #F1EDE7">
            <span style="position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 6px; background: #8A5300; color: #FFFFFF; font-size: 11px; font-weight: 800">Low stock</span>
          </a>
          <div style="padding: 10px 10px 12px">
            <h2 style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.3">Classic Hoodie</h2>
            <p style="margin: 4px 0 0; font-size: 12px; color: #5A6170">★ 4.5</p>
            <p style="margin: 6px 0 0; font-size: 15px; font-weight: 800">$59.00</p>
          </div>
        </article>
      
        <article style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; overflow: hidden">
          <a href="product.html" aria-label="Ceramic Pour-Over Set" style="display: block; position: relative; height: 128px; background: #EDF2EC">
            
          </a>
          <div style="padding: 10px 10px 12px">
            <h2 style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.3">Ceramic Pour-Over Set</h2>
            <p style="margin: 4px 0 0; font-size: 12px; color: #5A6170">★ 4.8</p>
            <p style="margin: 6px 0 0; font-size: 15px; font-weight: 800">$42.00</p>
          </div>
        </article>
      
        <article style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; overflow: hidden">
          <a href="product.html" aria-label="Linen Throw Blanket" style="display: block; position: relative; height: 128px; background: #F3ECF4">
            
          </a>
          <div style="padding: 10px 10px 12px">
            <h2 style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.3">Linen Throw Blanket</h2>
            <p style="margin: 4px 0 0; font-size: 12px; color: #5A6170">★ 4.6</p>
            <p style="margin: 6px 0 0; font-size: 15px; font-weight: 800">$64.00</p>
          </div>
        </article>
      
    </div>
  </main>

  <nav aria-label="Main" style="background: #FFFFFF; border-top: 1px solid #E3E6EB; display: flex; padding: 6px 4px 18px">
    
      <a href="index.html" aria-current="page" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #2747F5; font-size: 11px; font-weight: 700"><span aria-hidden="true" style="font-size: 18px; line-height: 1">⌂</span>Shop</a>
    
      <a href="orders.html" aria-current="false" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px; font-weight: 700"><span aria-hidden="true" style="font-size: 18px; line-height: 1">▤</span>Orders</a>
    
      <a href="lab.html" aria-current="false" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px; font-weight: 700"><span aria-hidden="true" style="font-size: 18px; line-height: 1">⚗</span>Lab</a>
    
      <a href="account.html" aria-current="false" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px; font-weight: 700"><span aria-hidden="true" style="font-size: 18px; line-height: 1">◉</span>Account</a>
    
  </nav>
</div>
</body>
</html>
