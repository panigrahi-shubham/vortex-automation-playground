name: Playwright
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Run against a deployed ShopLab (leave empty to start one locally)'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:workflows
      - run: npm run test:pricing
      - run: npm run test:storefront-adapter
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex_ci
          POSTGRES_DB: vortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vortex -d vortex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vortex:vortex_ci@localhost:5432/vortex_test?schema=orvilo
      DIRECT_URL: postgresql://vortex:vortex_ci@localhost:5432/vortex_test?schema=orvilo
      ORVILO_MFA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed:catalog
      - run: npm run test:db
