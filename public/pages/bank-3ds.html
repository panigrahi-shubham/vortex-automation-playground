<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Secure Bank · Verification</title>
<style>
  body{margin:0;font:14px/1.5 Georgia,'Times New Roman',serif;background:#f8fafc;color:#0f172a}
  header{background:#1e3a8a;color:#fff;padding:10px 16px;font-weight:700;letter-spacing:.02em}
  main{padding:16px} label{display:block;font-weight:700;margin:12px 0 4px}
  input{font:inherit;font-size:18px;letter-spacing:.3em;padding:8px;width:160px;border:1px solid #94a3b8;border-radius:4px}
  button{font:inherit;padding:8px 14px;border-radius:4px;border:1px solid #1e3a8a;cursor:pointer;margin-right:6px}
  .primary{background:#1e3a8a;color:#fff} .err{color:#b91c1c;min-height:20px;margin:8px 0} .hint{background:#fef9c3;padding:6px 10px;border-radius:4px;font-size:13px}
</style></head>
<body>
  <header>🏦 Secure Bank · 3-D Secure</header>
  <main>
    <p>Confirm your payment of <strong id="amount" data-testid="3ds-amount"></strong> to <strong>ShopLab</strong>.</p>
    <p class="hint">Test environment — your code is <strong>123456</strong></p>
    <form id="f" novalidate>
      <label for="code">One-time passcode</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" data-testid="3ds-code">
      <p class="err" id="err" role="alert" data-testid="3ds-error"></p>
      <button class="primary" data-testid="3ds-submit">Verify</button><button type="button" id="cancel" data-testid="3ds-cancel">Cancel payment</button>
    </form>
  </main>
  <script>
    const qs = new URLSearchParams(location.search);
    const challengeId = qs.get('challenge');
    document.getElementById('amount').textContent = '$' + (qs.get('amount') || '0.00');
    let token = null; try { token = localStorage.getItem('shoplab.token'); } catch {}
    const send = msg => window.parent.postMessage(msg, location.origin);
    async function submit(code) {
      const btns = document.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
      document.getElementById('err').textContent = '';
      try {
        const r = await fetch('/api/checkout/3ds', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ challengeId, code }) });
        const d = await r.json().catch(() => ({}));
        if (r.status === 201) return send({ type: '3ds-complete', order: d });
        if (r.status === 422) { document.getElementById('err').textContent = d.error + (d.attemptsLeft ? ` (${d.attemptsLeft} attempt${d.attemptsLeft > 1 ? 's' : ''} left)` : ''); return; }
        send({ type: '3ds-failed', error: d.error || 'Verification failed' });
      } catch { document.getElementById('err').textContent = 'Network error, try again'; }
      finally { btns.forEach(b => b.disabled = false); }
    }
    document.getElementById('f').onsubmit = e => { e.preventDefault(); submit(document.getElementById('code').value.trim()); };
    document.getElementById('cancel').onclick = () => submit('cancel');
    document.getElementById('code').focus();
  </script>
</body></html>
